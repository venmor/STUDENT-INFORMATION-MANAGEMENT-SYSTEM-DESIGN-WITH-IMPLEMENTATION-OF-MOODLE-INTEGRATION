services:
  moodle:
    ports:
      - "127.0.0.1:${MOODLE_HTTP_PORT:-8090}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$fp = @fsockopen(\"127.0.0.1\", 8080, $$errno, $$errstr, 5); if (!$$fp) { fwrite(STDERR, $$errstr); exit(1); } fwrite($$fp, \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\"); $$line = fgets($$fp); if ($$line === false || strpos($$line, \"HTTP/\") !== 0) { exit(1); }'",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
