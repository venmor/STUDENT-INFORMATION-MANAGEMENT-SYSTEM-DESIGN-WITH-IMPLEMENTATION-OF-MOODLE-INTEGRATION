name: modern-sis

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,backend,proxy}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-modern_sis}
  MYSQL_USER: ${MYSQL_USER:-modern_sis}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modern_sis}
  MYSQL_HOST: db
  MYSQL_PORT: 3306

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-modern_sis}
      MYSQL_USER: ${MYSQL_USER:-modern_sis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modern_sis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"

  redis:
    image: redis:7-alpine
    profiles: ["later-phase"]
    restart: unless-stopped
    expose:
      - "6379"

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "echo 'Celery worker placeholder for later phases'; sleep infinity"]
    profiles: ["later-phase"]
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "echo 'Celery beat placeholder for later phases'; sleep infinity"]
    profiles: ["later-phase"]
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.6
    profiles: ["later-phase"]
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  moodle_db:
    image: mariadb:11
    profiles: ["later-phase"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME:-moodle}
      MARIADB_USER: ${MOODLE_DB_USER:-moodle}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodle}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD:-root}
    volumes:
      - moodle_db_data:/var/lib/mysql

  moodle:
    image: bitnami/moodle:4.3
    profiles: ["later-phase"]
    restart: unless-stopped
    depends_on:
      moodle_db:
        condition: service_started
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle_db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:-moodle}
    expose:
      - "8080"
    volumes:
      - moodle_data:/bitnami/moodle

volumes:
  mysql_data:
  qdrant_data:
  moodle_db_data:
  moodle_data:
