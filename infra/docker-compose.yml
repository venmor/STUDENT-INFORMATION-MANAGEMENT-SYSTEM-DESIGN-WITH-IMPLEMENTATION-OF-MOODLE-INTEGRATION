name: modern-sis

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,backend,proxy}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-modern_sis}
  MYSQL_USER: ${MYSQL_USER:-modern_sis}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modern_sis}
  MYSQL_HOST: db
  MYSQL_PORT: 3306
  MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
  MOODLE_WS_TOKEN: ${MOODLE_WS_TOKEN:-}
  MOODLE_DEFAULT_CATEGORY_ID: ${MOODLE_DEFAULT_CATEGORY_ID:-0}
  MOODLE_STUDENT_ROLE_ID: ${MOODLE_STUDENT_ROLE_ID:-0}
  MOODLE_EDITING_TEACHER_ROLE_ID: ${MOODLE_EDITING_TEACHER_ROLE_ID:-0}
  MOODLE_INSTITUTION: ${MOODLE_INSTITUTION:-Student Information System}
  MOODLE_GRADE_SOURCE: ${MOODLE_GRADE_SOURCE:-modern_sis}
  MOODLE_SYNC_TIMEOUT: ${MOODLE_SYNC_TIMEOUT:-10}
  LTI_PLATFORM_ISSUER_ALLOWLIST: ${LTI_PLATFORM_ISSUER_ALLOWLIST:-}
  LTI_CLIENT_ID: ${LTI_CLIENT_ID:-}
  LTI_DEPLOYMENT_ID: ${LTI_DEPLOYMENT_ID:-}
  LTI_PRIVATE_KEY: ${LTI_PRIVATE_KEY:-}
  LTI_PRIVATE_KEY_FILE: ${LTI_PRIVATE_KEY_FILE:-}
  LTI_PUBLIC_KEY: ${LTI_PUBLIC_KEY:-}
  LTI_PUBLIC_KEY_FILE: ${LTI_PUBLIC_KEY_FILE:-}
  LTI_KEY_ID: ${LTI_KEY_ID:-modern-sis-lti-key}
  LTI_PLATFORM_AUTH_LOGIN_URL: ${LTI_PLATFORM_AUTH_LOGIN_URL:-}
  LTI_PLATFORM_AUTH_TOKEN_URL: ${LTI_PLATFORM_AUTH_TOKEN_URL:-}
  LTI_PLATFORM_JWKS_URL: ${LTI_PLATFORM_JWKS_URL:-}
  LTI_PLATFORM_PUBLIC_KEY: ${LTI_PLATFORM_PUBLIC_KEY:-}
  LTI_PLATFORM_PUBLIC_KEY_FILE: ${LTI_PLATFORM_PUBLIC_KEY_FILE:-}
  LTI_LAUNCH_SUCCESS_REDIRECT_BASE: ${LTI_LAUNCH_SUCCESS_REDIRECT_BASE:-}
  LTI_STATE_TTL_SECONDS: ${LTI_STATE_TTL_SECONDS:-600}
  LTI_SESSION_TTL_SECONDS: ${LTI_SESSION_TTL_SECONDS:-3600}
  LTI_SESSION_COOKIE_NAME: ${LTI_SESSION_COOKIE_NAME:-sis_lti_session}
  LTI_SESSION_COOKIE_SECURE: ${LTI_SESSION_COOKIE_SECURE:-false}
  LTI_SESSION_COOKIE_SAMESITE: ${LTI_SESSION_COOKIE_SAMESITE:-Lax}

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-modern_sis}
      MYSQL_USER: ${MYSQL_USER:-modern_sis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-modern_sis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"

  redis:
    image: redis:7-alpine
    profiles: ["later-phase"]
    restart: unless-stopped
    expose:
      - "6379"

  celery_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "echo 'Celery worker placeholder for later phases'; sleep infinity"]
    profiles: ["later-phase"]
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "echo 'Celery beat placeholder for later phases'; sleep infinity"]
    profiles: ["later-phase"]
    restart: unless-stopped
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.13.6
    profiles: ["later-phase"]
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  moodle_db:
    image: mariadb:11
    profiles: ["later-phase"]
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${MOODLE_DB_NAME:-moodle}
      MARIADB_USER: ${MOODLE_DB_USER:-moodle}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodle}
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD:-root}
    volumes:
      - moodle_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: bitnamilegacy/moodle:4.5.4
    profiles: ["later-phase"]
    restart: unless-stopped
    depends_on:
      moodle_db:
        condition: service_healthy
    environment:
      MOODLE_HOST: ${MOODLE_HOST:-}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME:-Student Information System Moodle}
      MOODLE_USERNAME: ${MOODLE_USERNAME:-admin}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-ChangeMe123!}
      MOODLE_EMAIL: ${MOODLE_EMAIL:-admin@example.com}
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle_db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:-moodle}
    expose:
      - "8080"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_runtime_data:/bitnami/moodledata

volumes:
  mysql_data:
  qdrant_data:
  moodle_db_data:
  moodle_data:
  moodle_runtime_data:
