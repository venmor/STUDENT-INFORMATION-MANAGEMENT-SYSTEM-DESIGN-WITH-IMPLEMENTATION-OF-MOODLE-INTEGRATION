name: Docker Build & Integration Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ci-secret-key-with-sufficient-length-1234567890
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,backend,proxy"
  MYSQL_DATABASE: modern_sis
  MYSQL_USER: modern_sis
  MYSQL_PASSWORD: modern_sis
  MYSQL_ROOT_PASSWORD: root
  MYSQL_HOST: db
  MYSQL_PORT: "3306"

jobs:
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: modern-sis-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: modern-sis-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify backend image runs
        run: |
          docker run --rm modern-sis-backend:ci python -c "import django; print(f'Django {django.VERSION}')"

      - name: Verify frontend image serves content
        run: |
          docker run -d --name frontend-test -p 8081:80 modern-sis-frontend:ci
          sleep 2
          curl -sf http://127.0.0.1:8081/ | grep -qi "<!doctype html>"
          docker rm -f frontend-test

  integration-test:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - name: Start core services
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d db backend frontend proxy

      - name: Wait for database health
        working-directory: infra
        run: |
          timeout 60 bash -c 'until docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T db mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; do sleep 2; done'

      - name: Run migrations
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T backend python manage.py migrate --noinput

      - name: Run Django system checks
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T backend python manage.py check

      - name: Check for migration drift
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T backend python manage.py makemigrations --check --dry-run

      - name: Run backend tests inside container
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T \
            -e MYSQL_USER=root \
            -e MYSQL_PASSWORD=root \
            backend pytest -q --cov=apps --cov-report=term-missing --cov-fail-under=80

      - name: Seed demo data
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T backend python manage.py seed_demo_sis

      - name: Smoke test API endpoints
        working-directory: infra
        run: |
          # Health / login endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/v1/auth/login)
          if [ "$STATUS" != "405" ]; then echo "Expected 405, got $STATUS"; exit 1; fi

          # Login with demo credentials
          TOKEN=$(curl -sf http://127.0.0.1:8080/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin.demo","password":"DemoPass123!"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # Test authenticated endpoint
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8080/api/v1/users)
          if [ "$STATUS" != "200" ]; then echo "Users endpoint: expected 200, got $STATUS"; exit 1; fi

          # Test frontend serves HTML
          curl -sf http://127.0.0.1:8080/ | grep -qi "<!doctype html>"

          echo "All smoke tests passed."

      - name: Show service logs on failure
        if: failure()
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=50

      - name: Tear down services
        if: always()
        working-directory: infra
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  compose-config-validation:
    name: Validate Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config > /dev/null

      - name: Validate staging compose
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.staging.yml config > /dev/null

      - name: Validate full stack with Moodle
        run: |
          docker compose \
            --env-file infra/moodle.env.example \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.dev.yml \
            -f infra/docker-compose.moodle.yml \
            --profile later-phase \
            config > /dev/null
