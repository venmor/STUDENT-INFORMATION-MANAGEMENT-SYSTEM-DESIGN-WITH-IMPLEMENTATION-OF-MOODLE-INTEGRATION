name: Phase 2 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: modern_sis
          MYSQL_USER: modern_sis
          MYSQL_PASSWORD: modern_sis
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key-with-sufficient-length-1234567890
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      MYSQL_DATABASE: modern_sis
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Django checks
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Python lint
        run: ruff check .

      - name: Backend tests with coverage gate
        run: pytest -q --cov=apps --cov-report=term-missing --cov-fail-under=80

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend unit tests
        run: npm test -- --reporter=dot

      - name: Frontend build
        run: npm run build

  container-validation:
    name: Container Validation
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t modern-sis-backend:ci ./backend

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t modern-sis-frontend:ci ./frontend

      - name: Validate dev compose configuration
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml config > /tmp/modern-sis-dev-compose.yaml

      - name: Validate staging compose configuration
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.staging.yml config > /tmp/modern-sis-staging-compose.yaml
