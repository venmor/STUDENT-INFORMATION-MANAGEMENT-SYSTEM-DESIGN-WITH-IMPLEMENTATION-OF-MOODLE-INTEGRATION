      required: [id, student, academicYear, semester, programme, activeEnrollmentCount, officialGradeCount, financialFlagCount, moodleSnapshotCount, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        student:
          $ref: '#/components/schemas/AnalyticsStudentSummary'
        academicYear:
          type: string
        semester:
          type: string
        programme:
          type: string
        yearOfStudy:
          type: integer
        academicStanding:
          type: string
        attendanceAverage:
          type: string
          nullable: true
        financialFlagCount:
          type: integer
        activeEnrollmentCount:
          type: integer
        draftGradeCount:
          type: integer
        officialGradeCount:
          type: integer
        gpa:
          type: string
          nullable: true
        latestMoodleAccessAt:
          type: string
          format: date-time
          nullable: true
        latestMoodleCourseAccessAt:
          type: string
          format: date-time
          nullable: true
        moodleSnapshotCount:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    AnalyticsSummary:
      type: object
      required: [studentsWithSnapshots, moodleSnapshotsUsed, officialGradeCount, financialFlags]
      properties:
        latestRun:
          oneOf:
            - $ref: '#/components/schemas/AnalyticsETLRun'
            - type: 'null'
        studentsWithSnapshots:
          type: integer
        moodleSnapshotsUsed:
          type: integer
        averageAttendance:
          type: string
          nullable: true
        officialGradeCount:
          type: integer
        financialFlags:
          type: integer
        latestMoodleAccessAt:
          type: string
          format: date-time
          nullable: true
    KnowledgeSource:
      type: object
      required: [id, sourceType, title, status, visibility, chunkCount, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceType:
          type: string
          enum: [ACADEMIC_CALENDAR, COURSE_CATALOG, ACADEMIC_REGULATIONS, REGISTRATION_PROCEDURES, FEE_SCHEDULE, SYSTEM_POLICY, OTHER]
        title:
          type: string
        description:
          type: string
        sourcePath:
          type: string
        status:
          type: string
          enum: [DRAFT, READY, INGESTED, FAILED]
        visibility:
          type: string
          enum: [PUBLIC_STUDENT, STAFF_ONLY, ADMIN_ONLY]
        checksumSha256:
          type: string
        metadata:
          type: object
          additionalProperties: true
        chunkCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    KnowledgeIngestionRun:
      type: object
      required: [id, status, startedAt, sourcesProcessed, chunksCreated, chunksUpserted, failureCount]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [STARTED, SUCCEEDED, FAILED, PARTIAL]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        sourcesProcessed:
          type: integer
        chunksCreated:
          type: integer
        chunksUpserted:
          type: integer
        failureCount:
          type: integer
        lastError:
          type: string
        metadata:
          type: object
          additionalProperties: true
    KnowledgeSummary:
      type: object
      required: [sources, chunks, vectorStore]
      properties:
        sources:
          type: integer
        chunks:
          type: integer
        latestIngestion:
          oneOf:
            - $ref: '#/components/schemas/KnowledgeIngestionRun'
            - type: 'null'
        vectorStore:
          type: object
          required: [provider, collection, healthy, message]
          properties:
            provider:
              type: string
            collection:
              type: string
            healthy:
              type: boolean
            message:
              type: string
    KnowledgeTestQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          maxLength: 500
        limit:
          type: integer
          minimum: 1
          maximum: 10
        sourceType:
          type: string
    KnowledgeRetrievalResult:
      type: object
      required: [chunkId, sourceId, sourceTitle, sourceType, score, text]
      properties:
        chunkId:
          type: string
        sourceId:
          type: string
          format: uuid
        sourceTitle:
          type: string
        sourceType:
          type: string
        score:
          type: number
        text:
          type: string
    KnowledgeTestQueryResponse:
      type: object
      required: [query, generatedAnswer, results]
      properties:
        query:
          type: string
        generatedAnswer:
          type: 'null'
        results:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRetrievalResult'
    CopilotConfidence:
      type: string
      enum: [HIGH, MEDIUM, LOW, UNSUPPORTED]
    CopilotSessionStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    CopilotMessageRole:
      type: string
      enum: [USER, ASSISTANT, SYSTEM]
    CopilotSource:
      type: object
      required: [sourceId, chunkId, title, sourceType, preview, score]
      properties:
        sourceId:
          type: string
        chunkId:
          type: string
        title:
          type: string
        sourceType:
          type: string
        preview:
          type: string
        score:
          type: number
    CopilotSuggestedAction:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
    CopilotQueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          maxLength: 1000
        sessionId:
          type: string
          format: uuid
          nullable: true
    CopilotQueryResponse:
      type: object
      required: [sessionId, messageId, answer, confidence, sources, suggestedNextActions, disclaimer]
      properties:
        sessionId:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        answer:
          type: string
        confidence:
          $ref: '#/components/schemas/CopilotConfidence'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/CopilotSource'
        suggestedNextActions:
          type: array
          items:
            $ref: '#/components/schemas/CopilotSuggestedAction'
        disclaimer:
          type: string
    CopilotSessionCreateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
    CopilotSession:
      type: object
      required: [id, title, status, metadata, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        status:
          $ref: '#/components/schemas/CopilotSessionStatus'
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
    CopilotMessage:
      type: object
      required: [id, role, content, sourceReferences, confidence, provider, modelName, retrievedChunkCount, metadata, createdAt]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/CopilotMessageRole'
        content:
          type: string
        sourceReferences:
          type: array
          items:
            $ref: '#/components/schemas/CopilotSource'
        confidence:
          $ref: '#/components/schemas/CopilotConfidence'
        provider:
          type: string
        modelName:
          type: string
        retrievedChunkCount:
          type: integer
        latencyMs:
          type: integer
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    CopilotSessionDetail:
      allOf:
        - $ref: '#/components/schemas/CopilotSession'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/CopilotMessage'
    CopilotFeedbackRequest:
