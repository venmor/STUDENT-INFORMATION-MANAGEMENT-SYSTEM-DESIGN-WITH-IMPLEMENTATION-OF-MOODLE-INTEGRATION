openapi: 3.1.0
info:
  title: Modern SIS API
  version: 0.6.0
  summary: Implemented Modern SIS backend contract through Phase 6
  description: >
    This contract reflects the implemented backend surface through Phase 4
    Step 4.2, including the student service co-pilot. Later staff
    summarisation, at-risk, wellbeing, and admissions endpoints remain
    documented in the SRS until their implementation phases begin.
servers:
  - url: https://sis.example.edu/api/v1
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Users
  - name: Students
  - name: Academics
  - name: Documents
  - name: Reports
  - name: Analytics
  - name: Knowledge
  - name: Copilot
  - name: Wellbeing
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/probes/advisor:
    get:
      tags: [Auth]
      summary: Verify advisor or admin route access
      responses:
        '200':
          description: Access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/probes/wellbeing:
    get:
      tags: [Auth]
      summary: Verify wellbeing capability-gated access
      responses:
        '200':
          description: Access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [Users]
      summary: List users
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create a user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/change-password:
    post:
      tags: [Users]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Fetch a user account
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user account
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/deactivate:
    post:
      tags: [Users]
      summary: Soft deactivate a user account
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: Reset a user's password and force reset on next login
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/access-logs:
    get:
      tags: [Users]
      summary: List access-log entries where the user is actor or subject
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Access logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessLogEntry'
        '404':
          $ref: '#/components/responses/NotFound'

  /students:
    get:
      tags: [Students]
      summary: List active student profiles visible to the caller
      responses:
        '200':
          description: Student profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Students]
      summary: Create a student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreateRequest'
      responses:
        '201':
          description: Student profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /students/{studentId}:
    get:
      tags: [Students]
      summary: Fetch a student profile
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Students]
      summary: Update editable student profile fields
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdateRequest'
      responses:
        '200':
          description: Student profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/deactivate:
    post:
      tags: [Students]
      summary: Soft deactivate a student profile
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Student profile deactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/advisor-assignments:
    post:
      tags: [Students]
      summary: Assign or reassign a current advisor
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorAssignmentCreateRequest'
      responses:
        '201':
          description: Advisor assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/financial-flags:
    get:
      tags: [Students]
      summary: List financial flags for a student
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Financial flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialFlag'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Students]
      summary: Create a financial flag
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialFlagCreateRequest'
      responses:
        '201':
          description: Financial flag created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialFlag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/financial-flags/{flagId}:
    patch:
      tags: [Students]
      summary: Update or clear a financial flag
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/FlagId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialFlagUpdateRequest'
      responses:
        '200':
          description: Financial flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialFlag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/advising-notes:
    get:
      tags: [Students]
      summary: List advising notes visible to the caller
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Advising notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdvisingNote'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Students]
      summary: Create an advising note
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisingNoteCreateRequest'
      responses:
        '201':
          description: Advising note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisingNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/advising-notes/{noteId}:
    patch:
      tags: [Students]
      summary: Update a draft advising note
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisingNoteUpdateRequest'
      responses:
        '200':
          description: Advising note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisingNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/advising-notes/{noteId}/approve:
    post:
      tags: [Students]
      summary: Approve an advising note
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Advising note approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisingNote'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/correction-requests:
    get:
      tags: [Students]
      summary: List student correction requests
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Correction requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentCorrectionRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Students]
      summary: Submit a student profile correction request
      parameters:
        - $ref: '#/components/parameters/StudentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCorrectionRequestCreateRequest'
      responses:
        '201':
          description: Correction request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCorrectionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/correction-requests/{correctionRequestId}:
    patch:
      tags: [Students]
      summary: Review a student correction request
      parameters:
        - $ref: '#/components/parameters/StudentId'
        - $ref: '#/components/parameters/CorrectionRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCorrectionRequestReviewRequest'
      responses:
        '200':
          description: Correction request reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCorrectionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /students/{studentId}/transcript:
    get:
      tags: [Academics]
      summary: Generate a transcript PDF
      parameters:
        - $ref: '#/components/parameters/StudentId'
      responses:
        '200':
          description: Transcript PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses:
    get:
      tags: [Academics]
      summary: List courses
      responses:
        '200':
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
    post:
      tags: [Academics]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreateRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /courses/{courseId}:
    get:
      tags: [Academics]
      summary: Fetch a course
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Academics]
      summary: Update a course
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdateRequest'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /courses/{courseId}/prerequisites:
    post:
      tags: [Academics]
      summary: Add a prerequisite course
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrerequisiteCreateRequest'
      responses:
        '201':
          description: Prerequisite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrerequisiteLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sections:
    get:
      tags: [Academics]
      summary: List visible sections for the caller
      responses:
        '200':
          description: Sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSection'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Academics]
      summary: Create a course section
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionCreateRequest'
      responses:
        '201':
          description: Section created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sections/{sectionId}:
    get:
      tags: [Academics]
      summary: Fetch a course section
      parameters:
        - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: Section details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSection'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Academics]
      summary: Update a course section
      parameters:
        - $ref: '#/components/parameters/SectionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionUpdateRequest'
      responses:
        '200':
          description: Section updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sections/{sectionId}/roster:
    get:
      tags: [Academics]
      summary: Read the enrolled roster for a section
      parameters:
        - $ref: '#/components/parameters/SectionId'
      responses:
        '200':
          description: Section roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionRosterEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /enrollments:
    get:
      tags: [Academics]
      summary: List visible enrollments for the authenticated role scope
      parameters:
        - name: student_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: section_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'
    post:
      tags: [Academics]
      summary: Create an enrollment or waitlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
      responses:
        '201':
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /enrollments/bulk-preview:
    post:
      tags: [Academics]
      summary: Preview a CSV bulk enrollment import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Preview generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEnrollmentPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /enrollments/bulk-commit:
    post:
      tags: [Academics]
      summary: Commit a CSV bulk enrollment import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Bulk import committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEnrollmentCommitResponse'
        '400':
          description: Bulk import failed or created no records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkEnrollmentCommitResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /enrollments/{enrollmentId}/drop:
    post:
      tags: [Academics]
      summary: Drop an enrollment
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentDropRequest'
      responses:
        '200':
          description: Enrollment dropped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /enrollments/{enrollmentId}/transfer:
    post:
      tags: [Academics]
      summary: Transfer an enrollment to another section
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentTransferRequest'
      responses:
        '200':
          description: Enrollment transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /attendance/sessions:
    post:
      tags: [Academics]
      summary: Record attendance for a section session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceSessionCreateRequest'
      responses:
        '201':
