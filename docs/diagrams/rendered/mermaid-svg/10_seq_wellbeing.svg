<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="680" viewBox="0 0 1100 680"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif">
  <title>10 — Sequence: Wellbeing Check-In</title>
  <rect width="1100" height="680" fill="#f8fafc" rx="0"/>
  <rect x="0" y="0" width="1100" height="56" rx="0" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.5" opacity="1"/>
  <text x="550" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="white" font-weight="600">10 — Sequence: Wellbeing Check-In</text>
  <text x="550" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8" font-weight="400">Opt-in consent gate → deterministic rules → restricted schema write → escalation if triggered</text>
  <rect x="10" y="68" width="160" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/>
  <text x="90" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">Student</text>
  <rect x="210" y="68" width="160" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/>
  <text x="290" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">React App</text>
  <rect x="430" y="68" width="160" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" opacity="1"/>
  <text x="510" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">Django API</text>
  <rect x="640" y="68" width="160" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" opacity="1"/>
  <text x="720" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">Rules Engine</text>
  <rect x="820" y="68" width="160" height="44" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.5" opacity="1"/>
  <text x="900" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">Wellbeing Schema</text>
  <rect x="970" y="68" width="160" height="44" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" opacity="1"/>
  <text x="1050" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">Notification</text>
  <text x="1050" y="97" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1e3a5f" font-weight="600">Service</text>
  <line x1="90" y1="112" x2="90" y2="670" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="290" y1="112" x2="290" y2="670" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="510" y1="112" x2="510" y2="670" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="720" y1="112" x2="720" y2="670" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="900" y1="112" x2="900" y2="670" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="1050" y1="112" x2="1050" y2="670" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="140" x2="290" y2="140" stroke="#2563eb" stroke-width="1.5"/>
  <polygon points="290,140 276.0,144.0 276.0,136.0" fill="#2563eb"/>
  <text x="190" y="133" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Open wellbeing check-in</text>
  <line x1="290" y1="170" x2="510" y2="170" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="510,170 496.0,174.0 496.0,166.0" fill="#16a34a"/>
  <text x="400" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">POST /api/v1/ai/wellbeing/triage</text>
  <line x1="510" y1="200" x2="720" y2="200" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="720,200 706.0,204.0 706.0,196.0" fill="#d97706"/>
  <text x="615" y="193" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Evaluate mood_rating + keyword rules</text>
  <line x1="720" y1="230" x2="510" y2="230" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="510,230 524.0,226.0 524.0,234.0" fill="#d97706"/>
  <text x="615" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Triage class: Normal / Concerning / Escalate</text>
  <line x1="510" y1="260" x2="900" y2="260" stroke="#be185d" stroke-width="1.5"/>
  <polygon points="900,260 886.0,264.0 886.0,256.0" fill="#be185d"/>
  <text x="705" y="253" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Store check-in + restricted audit metadata</text>
  <rect x="80" y="285" width="990" height="260" rx="6" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5" opacity="1"/>
  <text x="150" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9333ea" font-weight="600">alt</text>
  <text x="540" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9333ea" font-weight="400">Escalate</text>
  <line x1="80" y1="315" x2="1070" y2="315" stroke="#9333ea" stroke-width="0.8" stroke-dasharray="4 2"/>
  <line x1="510" y1="330" x2="1050" y2="330" stroke="#0891b2" stroke-width="1.5"/>
  <polygon points="1050,330 1036.0,334.0 1036.0,326.0" fill="#0891b2"/>
  <text x="780" y="323" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Alert wellbeing_coordinator within 60s</text>
  <line x1="510" y1="355" x2="290" y2="355" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="290,355 304.0,351.0 304.0,359.0" fill="#16a34a"/>
  <text x="400" y="348" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Show crisis contacts + escalation confirmation</text>
  <line x1="80" y1="380" x2="1070" y2="380" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="540" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#d97706" font-weight="400">Concerning</text>
  <line x1="510" y1="415" x2="290" y2="415" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="290,415 304.0,411.0 304.0,419.0" fill="#16a34a"/>
  <text x="400" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Show curated counselling resources</text>
  <line x1="80" y1="440" x2="1070" y2="440" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="540" y="458" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a" font-weight="400">Normal</text>
  <line x1="510" y1="475" x2="290" y2="475" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="290,475 304.0,471.0 304.0,479.0" fill="#16a34a"/>
  <text x="400" y="468" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" font-weight="400">Show self-care resources</text>
  <rect x="80" y="558" width="990" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" opacity="1"/>
  <text x="570" y="576" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626" font-weight="600">Critical rule: LLM is never the sole escalation decision-maker.</text>
  <text x="570" y="596" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#dc2626" font-weight="400">Deterministic rules engine classifies triage. LLM may assist with supportive wording only.</text>
</svg>
