  <rect x="840" y="394" width="12" height="12" rx="3" fill="#dc2626" stroke="#dc2626" stroke-width="1.5" opacity="1"/>
  <text x="862" y="405" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#1e293b" font-weight="400">Wellbeing free-text: deleted</text>
