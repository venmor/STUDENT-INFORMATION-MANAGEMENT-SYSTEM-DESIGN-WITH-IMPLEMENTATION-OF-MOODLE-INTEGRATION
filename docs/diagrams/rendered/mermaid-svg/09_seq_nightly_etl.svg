  <rect x="80" y="545" width="980" height="50" rx="0" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5" opacity="1"/>
  <text x="200" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" font-weight="600">else</text>
  <text x="570" y="562" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" font-weight="400">Low or no risk</text>
